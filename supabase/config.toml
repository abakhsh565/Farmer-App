# Supabase CLI configuration.
#
# Three databases, one per environment, and this file is about the *first* one:
# the local stack a developer runs on their own machine.
#
#   dev         this file — Docker on the laptop, started with `npm run stack:start`
#   staging     project zmyvkwijloqylvftvhvq
#   production  project swmbmtvwgksicfnfsehg
#
# The cloud projects are addressed with `--project-ref`, never by editing
# `project_id` here: a `project_id` that names a cloud project is how a local
# command turns into a production command. This one is the local stack's name.
#
# Ports are deliberately not the CLI defaults. Another Supabase project already
# runs on 54321–54327 on this machine, and two stacks cannot share a port; a
# clash fails the start with "port is already allocated", which reads like a
# Docker problem rather than a numbering one.
project_id = "farmer-app"

[api]
# 54421 rather than 54321 — see the note above.
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[studio]
port = 54423

[local_smtp]
# Where the local stack delivers email. The app never needs it (sign-in is by
# phone), but a magic link or a password reset is testable without a provider.
# `[inbucket]` was the old name for this section; the CLI now refuses to load a
# config that still carries it, which blocked `supabase db push` in CI.
enabled = true
port = 54424
smtp_port = 54425
pop3_port = 54426

[analytics]
port = 54427

[auth]
# The dev server the app runs on, so a confirmation link lands back in the app
# instead of on a page that does not exist.
site_url = "http://127.0.0.1:5273"
additional_redirect_urls = ["http://127.0.0.1:5273", "http://localhost:5273"]

[auth.email]
# No mail provider locally, so a confirmation link can never be delivered; the
# account is confirmed on sign-up instead.
enable_confirmations = false

[auth.sms]
# The app signs in with a phone number, so the provider has to be enabled even
# though nothing is ever sent: the fixed codes below are what answer. Without
# `enable_signup` GoTrue rejects the number outright with
# "phone_provider_disabled".
enable_signup = true
enable_confirmations = false

[auth.sms.test_otp]
# The same two fixed codes staging uses, so signing in locally is one number and
# one code — no SMS provider anywhere in the loop. The session this mints is a
# real one, which is the point: the row-level policies are the real ones too.
923001234567 = "123456"
923001111111 = "111111"

[auth.sms.twilio]
# GoTrue will not accept a phone number at all unless an SMS provider is enabled,
# even when the code is one of the fixed ones above and nothing is ever sent. So
# the provider is enabled with placeholders that cannot reach Twilio: the test
# codes answer first, and any other number fails here rather than texting a
# stranger — this machine has no SMS account, by design.
enabled = true
account_sid = "local-development-placeholder"
message_service_sid = "local-development-placeholder"
# `env(...)` is the CLI's variable substitution; unset, the placeholder below is
# what GoTrue sees.
auth_token = "local-development-placeholder"


[functions.notify-shop-owner]
# The function is called by a database trigger, not by a signed-in user, and it
# proves that with its own shared secret (SHOP_PUSH_TOKEN) rather than a JWT the
# gateway would have to accept. So the gateway's JWT check is off here and the
# function's own check is the only door — a caller without the token gets 403.
verify_jwt = false
