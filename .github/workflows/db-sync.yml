# Database sync: keep each environment's database aligned with the code
# that runs against it.
#
# - Alignment check runs on every push to development/staging/main. Every
#   RPC the code calls must exist in supabase/migrations (or be a known
#   remote AgriShop call), and every VITE_* variable the code reads must
#   be documented in .env.example.
# - Migration apply runs only on staging/main pushes, and only when the
#   Supabase access token secret exists. It applies the repo's migration
#   chain to THAT environment's project (staging -> staging project,
#   main -> production project). Development has no cloud project (local
#   only), so nothing is applied for it.
# - The job skips loudly rather than failing when secrets are missing, so
#   this workflow is safe to land before the new staging project exists.
# - Nothing here touches the AgriShop projects. Those live in a separate
#   repo with their own migration flow.
# - No APK is built here. APKs are generated once manually when AB asks
#   for a fresh one; updates reach installed APKs via OTA only.

name: DB sync

on:
  push:
    branches: [development, staging, main]
    paths:
      - 'supabase/migrations/**'
      - 'src/**'
      - 'scripts/check-db-alignment.mjs'
      - '.github/workflows/db-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: node scripts/check-db-alignment.mjs

  migrate:
    needs: alignment
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target project
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "project_ref=${{ vars.PROD_SUPABASE_PROJECT_REF }}" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "project_ref=${{ vars.STAGING_SUPABASE_PROJECT_REF }}" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when the database is not configured yet
        if: env.SUPABASE_ACCESS_TOKEN == '' || steps.target.outputs.project_ref == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN or the ${{ steps.target.outputs.env_name }} project ref is not set, so no migrations were applied."
          echo "Set the secret and the Actions variable, then re-run this workflow."

      # Pinned deliberately, and *new*. `setup-cli@v1` defaults to 2.20.3, which
      # cannot read this repository's `supabase/config.toml` (`db.major_version = 17`)
      # and fails before it runs a single migration — the migrate job was green only
      # while it was being skipped for lack of a token.
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.target.outputs.project_ref != ''
        with:
          version: latest

      - name: Show what would change, then apply it
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.target.outputs.project_ref != ''
        env:
          SUPABASE_PROJECT_REF: ${{ steps.target.outputs.project_ref }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run
          supabase db push

      # `db push` can exit 0 having applied less than the repo contains (a stamped
      # but missing file, a version clash). Asking the database what it is on is the
      # only honest confirmation, and it is the same comparison verify:release makes
      # against a live release.
      - name: Prove the database is on this commit's newest migration
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.target.outputs.project_ref != ''
        env:
          PROJECT_REF: ${{ steps.target.outputs.project_ref }}
        run: |
          newest=$(ls supabase/migrations | grep -E '^[0-9]{8,}_' | sort | tail -1 | cut -d_ -f1)
          applied=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"query":"select version from supabase_migrations.schema_migrations order by version desc limit 1"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);console.log(Array.isArray(r)?(r[0]?.version??'none'):'unreadable')})")
          echo "newest in repo: $newest"
          echo "applied in project: $applied"
          if [ "$newest" != "$applied" ]; then
            echo "::error::the ${{ steps.target.outputs.env_name }} database is not on the newest migration (applied $applied, repo $newest)"
            exit 1
          fi
