# Live updates: publish the web bundle to each environment's own channel.
#
# One channel per environment, one release tag per channel. A push to the branch
# that names an environment publishes that environment's bundle; installed apps on
# that channel pick it up on their next launch, so nothing is reinstalled.
#
#   development  →  ota-dev
#   staging      →  ota-staging
#   main         →  ota-production
#
# The backend each branch talks to is chosen from `VITE_APP_ENV` by
# `src/services/appEnvironments.ts`, exactly like the shop project — so the only
# value still supplied here is the analytics key. Nothing per-environment goes in
# a repository secret: a single `VITE_SUPABASE_URL` secret would be read by all
# three branches, which is the arrangement this split exists to end.
#
# The three APKs embed the same five values at build time; this workflow only
# replaces the web layer, so a plugin or permission change still needs a new APK.

name: OTA bundle

on:
  push:
    branches: [development, staging, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ota-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_ANALYTICS_KEY: ${{ secrets.VITE_ANALYTICS_KEY }}
      #
      # The two shop projects are deliberately *not* injected here. They are chosen
      # from `VITE_APP_ENV` by `src/services/shopEnvironments.ts`, so a staging build
      # reads the staging shop project and a main build reads production. Supplying
      # one project's URL from a repository secret would override that choice on all
      # three branches and quietly point dev and staging at the live shop network.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Map the branch to its channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            development) echo "env=dev" >> "$GITHUB_OUTPUT" ;;
            staging) echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            main) echo "env=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown branch ${{ github.ref_name }}"; exit 1 ;;
          esac

      - name: Build, pack and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #
          # Which repository's Releases are this environment's channel.
          #
          # Staging publishes to the repository this workflow runs in, because a
          # workflow's `GITHUB_TOKEN` cannot write a release in another account's
          # copy — the staging publish was refused 403 against
          # `abakhsh56/Farmer-App`.
          #
          # Dev and production deliberately keep the default (`abakhsh56/Farmer-App`),
          # which is the repository already-installed apps poll: moving those
          # channels would strand every phone in the field until a new APK.
          OTA_RELEASE_REPO: ${{ github.ref_name == 'staging' && 'abakhsh565/Farmer-App' || '' }}
        run: |
          npx --yes tsx scripts/ota-publish.mjs --env "${{ steps.channel.outputs.env }}" || \
            node scripts/ota-publish.mjs --env "${{ steps.channel.outputs.env }}"
